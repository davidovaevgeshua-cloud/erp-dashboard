name: Обновление данных дашборда

on:
  schedule:
    # 18:30 МСК = 15:30 UTC, по будням
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Пересборка дашборда
        run: python build_static.py

      - name: Коммит изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html erp_daily.csv erp_quarterly.csv pe_quarterly.csv
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Автообновление данных MOEX $(date -u +%Y-%m-%d)"
            git push
          fi
